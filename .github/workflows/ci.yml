name: CI

# Checks the Rocq specification (proofs must check) and that the OCaml code
# extracted from it (lxr.ml / lxr.mli) matches what is committed.
# Mirrors .forgejo/workflows/CI.yaml; runs in the prepared build image that
# has the Rocq/opam toolchain and all vendored dependencies (docker/Dockerfile).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spec-and-extraction:
    runs-on: ubuntu-latest
    container:
      # pinned by digest (v0.9.16-1); replace with the digest of the next released image
      image: codieplusplus/elykseer-ml@sha256:db64f1a596d08b150cf36466c0039be43893498c4f1d539c1fd46ef90c8472e2
      # the workspace belongs to the runner, not to the image user "coq"
      options: --user root
    env:
      HOME: /home/coq
      OPAMROOT: /home/coq/.opam
      OPAMSWITCH: lxr
      OPAMROOTISOK: "1"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set aside the committed extraction
        run: |
          cp lxr.ml lxr.ml.committed
          cp lxr.mli lxr.mli.committed

      - name: Check Rocq spec and extract code (make)
        run: |
          eval "$(opam env)"
          coq_makefile -f _CoqProject -o Makefile
          make

      - name: Verify extraction matches committed lxr.ml / lxr.mli
        run: |
          diff -u lxr.ml.committed lxr.ml
          diff -u lxr.mli.committed lxr.mli
          echo "extracted code is in sync with the committed lxr.ml / lxr.mli"
